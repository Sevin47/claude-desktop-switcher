name: History safety

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: History engine regressions
        run: node --test tests/history-sync.test.mjs
      - name: Windows PowerShell integration
        shell: powershell
        run: |
          & .\tests\profile-history.test.ps1
          & .\tests\autoswitch-history.test.ps1
      - name: PowerShell 7 integration
        shell: pwsh
        run: |
          & .\tests\profile-history.test.ps1
          & .\tests\autoswitch-history.test.ps1
